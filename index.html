<!DOCTYPE html>
<html lang="es-MX">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Servicio suspendido - Internet Usumacinta</title>
<style>
  :root {
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);

    --bg-1: #082c3e;
    --bg-2: #11506e;
    --card: #ffffff;
    --ink: #0d4a66;
    --muted-c: #5b7688;
    --line: #e5edf2;
    --navy: #0d4d6a;
    --blue: #2b9cc4;
    --orange: #ef7d18;
    --orange-soft: #fff1e2;
    --wa: #1fab54;
    --wa-press: #178a43;
  }
  *, *::before, *::after { box-sizing: inherit; }

  html, body { height: 100%; }
  body {
    margin: 0;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    color: var(--ink);
    background:
      radial-gradient(120% 90% at 50% 0%, var(--bg-2) 0%, var(--bg-1) 62%),
      var(--bg-1);
    background-attachment: fixed;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px 18px;
    -webkit-font-smoothing: antialiased;
  }
  body::before {
    content: "";
    position: fixed;
    inset: 0;
    background-image: radial-gradient(rgba(255,255,255,.05) 1px, transparent 1px);
    background-size: 22px 22px;
    pointer-events: none;
  }

  .card {
    position: relative;
    width: 100%;
    max-width: 430px;
    background: var(--card);
    border-radius: 22px;
    padding: 0 0 26px;
    overflow: hidden;
    box-shadow: 0 24px 60px -20px rgba(4, 20, 30, .7);
    animation: rise .5s cubic-bezier(.2, .7, .2, 1) both;
  }
  .accent {
    height: 5px;
    background: linear-gradient(90deg, var(--navy), var(--blue) 70%, var(--orange));
  }
  .inner { padding: 30px 28px 0; }

  .brand {
    display: flex;
    justify-content: center;
    margin-bottom: 24px;
  }
  .brand img {
    width: 100%;
    max-width: 250px;
    height: auto;
    display: block;
  }

  .status {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    background: var(--orange-soft);
    color: #b85e05;
    font-size: 13px;
    font-weight: 600;
    padding: 7px 13px 7px 11px;
    border-radius: 999px;
    margin-bottom: 18px;
  }
  .status .dot {
    width: 9px;
    height: 9px;
    border-radius: 50%;
    background: var(--orange);
    animation: pulse 2s ease-out infinite;
  }

  h1 {
    font-size: 26px;
    line-height: 1.15;
    letter-spacing: -.5px;
    margin: 0 0 12px;
  }
  .lead {
    font-size: 15.5px;
    line-height: 1.55;
    color: #37566a;
    margin: 0 0 22px;
    max-width: 42ch;
  }
  .divider { height: 1px; background: var(--line); margin: 22px 0; }
  .contact-label { font-size: 13px; color: var(--muted-c); margin: 0 0 12px; }

  .btn {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    width: 100%;
    padding: 15px 18px;
    border-radius: 14px;
    font-size: 15.5px;
    font-weight: 600;
    text-decoration: none;
    border: none;
    cursor: pointer;
    transition: transform .06s ease, background .15s ease;
  }
  .btn:active { transform: scale(.985); }
  .btn-wa { background: var(--wa); color: #fff; box-shadow: 0 10px 22px -10px rgba(31,171,84,.8); }
  .btn-wa:active { background: var(--wa-press); }

  .note {
    font-size: 12.5px; line-height: 1.5; color: var(--muted-c);
    text-align: center; margin: 22px 0 0;
  }

  @keyframes rise { from {opacity:0; transform:translateY(14px);} to {opacity:1; transform:translateY(0);} }
  @keyframes pulse {
    0%   { box-shadow: 0 0 0 0 rgba(239,125,24,.5); }
    70%  { box-shadow: 0 0 0 9px rgba(239,125,24,0); }
    100% { box-shadow: 0 0 0 0 rgba(239,125,24,0); }
  }
  @media (prefers-reduced-motion: reduce) {
    .card { animation: none; }
    .status .dot { animation: none; }
    .btn { transition: none; }
  }
</style>
</head>
